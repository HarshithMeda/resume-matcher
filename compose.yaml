# Local run of the app with PostgreSQL 17:
#   docker compose up --build
# Secrets come from .env (not committed). Copy .env.example to .env and fill in real values.

name: resume-matcher

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: resumematcher
      POSTGRES_USER: resumematcher_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resumematcher_user -d resumematcher"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host: only the app can reach it (and a local PostgreSQL on 5432 is untouched).

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/resumematcher
      SPRING_DATASOURCE_USERNAME: resumematcher_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports:
      - "8080:8080"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    restart: unless-stopped

volumes:
  db-data:
