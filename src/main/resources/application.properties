spring.application.name=resume-matcher

# Secrets (spring.datasource.password, app.jwt.secret) live in local.properties,
# which is gitignored. "optional:" lets the app start without it (e.g. in CI with env vars).
spring.config.import=optional:file:./local.properties

# Render (and Docker) tell the app which port to use via PORT.
server.port=${PORT:8080}

# --- Health check (for Docker and Render): GET /actuator/health -> {"status":"UP"} ---
# Only the health endpoint is exposed, without details (no versions, no database info).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# /actuator/health/liveness: "the app is running", without checking the database. Used as Render's
# health check so a sleeping Neon database isn't woken every few seconds and slow database wake-ups
# don't make Render restart the app. /actuator/health still includes the database.
management.endpoint.health.probes.enabled=true

# --- Database ---
# Defaults for local development. In Docker/Render these come from SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD environment variables.
spring.datasource.url=jdbc:postgresql://localhost:5432/resumematcher
spring.datasource.username=resumematcher_user
# Small pool: enough for this app, light on a 512 MB container and on free-tier databases.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Never log SQL or bound parameters: rows will contain resume text (personal data).
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Devtools turns this on in dev. It logs full exception messages, which include
# rejected request values (passwords, resume text). Keep it off.
spring.mvc.log-resolved-exception=false

# --- Uploads ---
# Resumes are PDFs up to 2 MB (also checked in ResumeService). The request limit is a bit
# higher to leave room for multipart headers.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
# Let Tomcat read (and discard) slightly oversized uploads so the client gets our
# clean 413 JSON instead of a dropped connection.
server.tomcat.max-swallow-size=10MB
# PDFBox warnings can quote raw bytes or glyphs from the uploaded file. Silence them;
# parse failures are already turned into clean 422 responses.
logging.level.org.apache.pdfbox=OFF
logging.level.org.apache.fontbox=OFF

# --- Client IP (for the per-IP rate limits) ---
# Resolved by ClientIpResolver, not by Tomcat: X-Forwarded-For is only read when the connection
# comes from a trusted proxy, and at most max-proxy-hops trusted entries are skipped from the
# right. Local default: only a proxy on this machine (Vite dev server, tests) is trusted.
# Production values for Render are in application-prod.properties.
server.forward-headers-strategy=none
app.client-ip.trusted-proxies=127.0.0.1/32,::1/128
app.client-ip.max-proxy-hops=0

# --- Rate limits (in memory; reset on restart) ---
app.rate-limit.login.max-failures-per-email=5
app.rate-limit.login.max-failures-per-ip=20
app.rate-limit.login.window=15m
app.rate-limit.register.max-per-ip=5
app.rate-limit.register.window=1h
app.rate-limit.analyses.max-per-user-per-day=30

# --- Data retention ---
# Resumes and analyses older than this are deleted daily at the cron time (UTC).
app.retention.days=90
app.retention.cron=0 0 3 * * *

# --- JWT ---
app.jwt.issuer=resume-matcher
app.jwt.expiration=60m

# --- Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
