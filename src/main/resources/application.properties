spring.application.name=resume-matcher

# Secrets (spring.datasource.password, app.jwt.secret) live in local.properties,
# which is gitignored. "optional:" lets the app start without it (e.g. in CI with env vars).
spring.config.import=optional:file:./local.properties

# --- Database ---
spring.datasource.url=jdbc:postgresql://localhost:5432/resumematcher
spring.datasource.username=resumematcher_user

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Never log SQL or bound parameters: rows will contain resume text (personal data).
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Devtools turns this on in dev. It logs full exception messages, which include
# rejected request values (passwords, resume text). Keep it off.
spring.mvc.log-resolved-exception=false

# --- JWT ---
app.jwt.issuer=resume-matcher
app.jwt.expiration=60m

# --- Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
