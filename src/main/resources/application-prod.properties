# Production settings (Render + Neon). The Docker image turns this profile on
# (SPRING_PROFILES_ACTIVE=prod); local runs and tests don't use it.

# --- Swagger UI / OpenAPI docs: off unless SWAGGER_ENABLED=true ---
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# --- Client IP on Render ---
# Requests reach the app as: client -> Cloudflare -> Render's proxy -> app. Each proxy appends the
# address it received the request from, so X-Forwarded-For ends with
#   "<client>, <Cloudflare edge>, <Render internal 10.x>"
# and the connection itself comes from Render's internal network. We trust Render's private ranges
# and Cloudflare's published ranges (https://www.cloudflare.com/ips, checked 2026-11-07), and skip
# at most 2 hops, so whatever a client writes into the header itself is never used.
# Override with APP_CLIENT_IP_TRUSTED_PROXIES / APP_CLIENT_IP_MAX_PROXY_HOPS if Render changes this.
app.client-ip.max-proxy-hops=2
app.client-ip.trusted-proxies=\
  10.0.0.0/8,fc00::/7,\
  173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,\
  190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,\
  104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,\
  2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32
